# Catch a committed secret before it lands. A pull request scans its own
# commits; a push to main and the weekly sweep scan the whole history. The
# gitleaks binary runs over the local git range, so a GitHub API hiccup can
# never turn this red. Allowlist known placeholders in .gitleaks.toml.
#
# A pull request is scanned with the base branch's .gitleaks.toml and
# .gitleaksignore, and its gitleaks:allow comments don't count, so it can't
# loosen its own scan. Change an allowlist in a pull request of its own first.
name: Secret scan

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        id: install
        run: |
          set -euo pipefail
          VERSION=8.24.3
          # From the release's checksums.txt. Pinned here, so a swapped
          # release asset fails instead of running.
          SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Run gitleaks
        id: scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --redact keeps the value out of the log; --verbose names the rule,
          # file and commit, or a red run says only "leaks found: 1".
          args=(detect --source . --redact --verbose --no-banner)
          default_config=$'[extend]\nuseDefault = true\n'
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            config="$RUNNER_TEMP/base-gitleaks.toml"
            ignore="$RUNNER_TEMP/base-gitleaksignore"
            git show "$BASE:.gitleaks.toml" > "$config" 2>/dev/null || printf '%s' "$default_config" > "$config"
            git show "$BASE:.gitleaksignore" > "$ignore" 2>/dev/null || : > "$ignore"
            args+=(--config "$config" --gitleaks-ignore-path "$ignore" --ignore-gitleaks-allow
                   --log-opts="${BASE}..${HEAD}")
          elif [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          else
            printf '%s' "$default_config" > "$RUNNER_TEMP/default-gitleaks.toml"
            args+=(--config "$RUNNER_TEMP/default-gitleaks.toml")
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}"
      - name: Write the issue
        if: failure() && github.event_name == 'schedule'
        env:
          SCAN: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN" = "failure" ]; then
            {
              echo "The weekly full-history secret scan failed: it found something, or gitleaks"
              echo "itself failed (the run log says which). For a secret: rotate it first, then"
              echo "remove it from history; deleting the file in a new commit is not enough."
            } > issue.md
          else
            echo "The weekly secret scan could not run (the run log says which step failed), so" > issue.md
            echo "nothing was scanned this week. A scan that did not run is not a pass." >> issue.md
          fi
      - if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: "[secret-scan] the weekly sweep failed"
          body-file: issue.md
